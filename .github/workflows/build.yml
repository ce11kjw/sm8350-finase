name: build
on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        default: v1.4.5
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev libelf-dev zip unzip cpio rsync python3 git curl device-tree-compiler clang-14 lld-14 llvm-14
          # 无后缀工具名 shim（kbuild 有些地方直接调 llvm-nm 等）
          for t in ar nm objcopy objdump strip readelf as size; do
            src=$(command -v llvm-$t-14 || true)
            [ -n "$src" ] && sudo ln -sf "$src" /usr/local/bin/llvm-$t
          done
          sudo ln -sf $(command -v clang-14) /usr/local/bin/clang
          sudo ln -sf $(command -v ld.lld-14) /usr/local/bin/ld.lld
          clang --version | head -2
          ld.lld --version
          llvm-nm --version | head -1
      - name: kernel source
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/k.tar.gz https://codeload.github.com/LineageOS/android_kernel_xiaomi_sm8350/tar.gz/8252226d349c
          mkdir -p kernel
          tar -xzf /tmp/k.tar.gz -C kernel --strip-components=1
          test -d kernel/drivers
      - name: finasu
        run: |
          git clone --depth 1 -b ${{ inputs.ksu_ref }} https://github.com/LyraVoid/FinaSU.git /tmp/finasu
          cd kernel
          bash /tmp/finasu/kernel/setup.sh --dir /tmp/finasu ${{ inputs.ksu_ref }}
          echo "--- 5.4 兼容：补 linux/pgtable.h ---"
          if [ ! -f include/linux/pgtable.h ]; then
            echo '#include <asm/pgtable.h>' > include/linux/pgtable.h
            echo "created include/linux/pgtable.h shim"
          fi
      - name: configure
        run: |
          cd kernel
          make O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 TARGET_PRODUCT=star vendor/lahaina-qgki_defconfig vendor/debugfs.config vendor/xiaomi_QGKI.config
          for c in KSU KPROBES KALLSYMS_ALL EXT4_FS HEADERS_INSTALL THREAD_INFO_IN_TASK; do
            ./scripts/config --file out/.config --enable $c
          done
          ./scripts/config --file out/.config --disable KSU_SUSFS
          ./scripts/config --file out/.config --disable KSU_SUSFS
          ./scripts/config --file out/.config --disable KSU_HOOK_SUSFS_INLINE
          ./scripts/config --file out/.config --disable WERROR
          make O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 TARGET_PRODUCT=star olddefconfig
          grep -E "^CONFIG_(KSU|KSU_SUSFS|KPROBES|KALLSYMS_ALL|EXT4_FS|HEADERS_INSTALL)=" out/.config
      - name: build
        run: |
          cd kernel
          set +e
          make O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 TARGET_PRODUCT=star -j$(nproc) \
            KCFLAGS="-Wno-error" KSU_REQUIRE_PREINIT=1 \
            KSU_EXPECTED_SIZE=0x02cc \
            KSU_EXPECTED_HASH=2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458 \
            Image > /tmp/build.log 2>&1
          rc=$?
          echo "make exit=$rc"
          first=$(grep -nE 'Error [0-9]+' /tmp/build.log | head -1 | cut -d: -f1)
          if [ -n "$first" ]; then sed -n "$((first-25)),$((first+3))p" /tmp/build.log; else tail -40 /tmp/build.log; fi
          ls -l out/arch/arm64/boot/Image 2>/dev/null
          exit $rc
      - name: package
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          sed -i 's|^kernel.string=.*|kernel.string=FinaSU sm8350 star (CI)|' anykernel.sh
          sed -i 's|^do.devicecheck=.*|do.devicecheck=1|' anykernel.sh
          sed -i 's|^device.name1=.*|device.name1=star|' anykernel.sh
          sed -i 's|^device.name2=.*|device.name2=mars|' anykernel.sh
          sed -i 's|^device.name3=.*|device.name3=|' anykernel.sh
          sed -i 's|^device.name4=.*|device.name4=|' anykernel.sh
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          zip -r9 "$GITHUB_WORKSPACE/finasu-sm8350-star.zip" . -x ".git/*" "README.md" ".github/*"
          cd .. && ls -lh finasu-sm8350-star.zip
      - uses: actions/upload-artifact@v4
        with:
          name: finasu-sm8350-star
          path: finasu-sm8350-star.zip
