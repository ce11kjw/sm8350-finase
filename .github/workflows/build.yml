name: build
on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        default: v1.4.5
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential flex libssl-dev libelf-dev zip unzip cpio rsync python3 git curl device-tree-compiler clang-14 lld-14 llvm-14
          for t in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
            sudo ln -sf /usr/bin/$t-14 /usr/local/bin/$t 2>/dev/null || true
          done
          clang-14 --version | head -1; llvm-nm --version | head -1
      - name: kernel source
        run: |
          curl -fL --retry 3 --retry-delay 3 -o /tmp/k.tar.gz https://codeload.github.com/LineageOS/android_kernel_xiaomi_sm8350/tar.gz/8252226d349c
          mkdir -p kernel
          tar -xzf /tmp/k.tar.gz -C kernel --strip-components=1
          test -d kernel/drivers
      - name: finasu
        run: |
          git clone --depth 1 -b ${{ inputs.ksu_ref }} https://github.com/LyraVoid/FinaSU.git /tmp/finasu
          cd kernel
          bash /tmp/finasu/kernel/setup.sh --dir /tmp/finasu ${{ inputs.ksu_ref }}
          python3 "$GITHUB_WORKSPACE/patches/apply_54.py"
          echo "=== 5.4 兼容补丁 ==="
          if [ ! -f include/linux/pgtable.h ]; then echo '#include <asm/pgtable.h>' > include/linux/pgtable.h; echo "[+] pgtable.h shim"; fi
          pt() {
            local n=$(grep -rl -- "$1" drivers/kernelsu 2>/dev/null | wc -l)
            grep -rl -- "$1" drivers/kernelsu 2>/dev/null | xargs -r sed -i "s/$1/$2/g"
            echo "[+] $1 -> $2 ($n files)"
          }
          pt strncpy_from_user_nofault strncpy_from_user
          pt copy_to_kernel_nofault probe_kernel_write
          pt copy_from_kernel_nofault probe_kernel_read
          pt copy_to_user_nofault copy_to_user
          pt copy_from_user_nofault copy_from_user
          n=$(grep -rl TWA_RESUME drivers/kernelsu 2>/dev/null | wc -l)
          grep -rl TWA_RESUME drivers/kernelsu 2>/dev/null | xargs -r sed -i 's/, TWA_RESUME)/, true)/g'
          echo "[+] TWA_RESUME -> true ($n files)"
          # 5.4 没有 anon inode LSM hook
          grep -rl security_inode_init_security_anon drivers/kernelsu 2>/dev/null | xargs -r sed -i 's/security_inode_init_security_anon(inode, &qname, context_inode)/0/g'
          echo "[+] security_inode_init_security_anon -> 0"
          if [ -f drivers/kernelsu/infra/seccomp_cache.c ]; then
            sed -i '1i #include <asm/unistd.h>' drivers/kernelsu/infra/seccomp_cache.c
            sed -i 's/SECCOMP_ARCH_NATIVE_NR/__NR_syscalls/g' drivers/kernelsu/infra/seccomp_cache.c
            echo "[+] SECCOMP_ARCH_NATIVE_NR -> __NR_syscalls"
          fi
          if [ -f drivers/kernelsu/policy/app_profile.c ]; then
            sed -i 's|atomic_set(&current->seccomp.filter_count, 0);|/* 5.4: struct seccomp has no filter_count */|' drivers/kernelsu/policy/app_profile.c
            echo "[+] seccomp.filter_count removed"
          fi
          for f in $(grep -rl -e put_task_struct -e get_task_struct drivers/kernelsu --include='*.c' 2>/dev/null); do
            if ! grep -q 'linux/sched/task.h' "$f"; then sed -i '1i #include <linux/sched/task.h>' "$f"; echo "[+] sched/task.h -> $f"; fi
          done
          # path_umount 回移（Linux 5.9 才有）
          if ! grep -q 'int path_umount' fs/namespace.c; then
            printf '\n/* 5.4 backport: path_umount (Linux 5.9) for KernelSU */\nint path_umount(struct path *path, int flags)\n{\n\tstruct mount *mnt = real_mount(path->mnt);\n\tint ret;\n\tret = do_umount(mnt, flags);\n\tif (!ret) {\n\t\tdput(path->dentry);\n\t\tmntput_no_expire(mnt);\n\t}\n\treturn ret;\n}\n' >> fs/namespace.c
            echo "[+] path_umount backport injected"
          fi
          grep -rn 'nofault\|TWA_RESUME\|security_inode_init_security_anon' drivers/kernelsu 2>/dev/null | head -3 || echo "[+] clean"
      - name: ksu diag
        if: ${{ inputs.stealth != '1' }}
        run: |
          cd kernel/drivers/kernelsu
          python3 "$GITHUB_WORKSPACE/patches/ksu_diag.py"
          python3 "$GITHUB_WORKSPACE/patches/direct_hooks.py"
      - name: features
        run: |
          cd kernel
          python3 "$GITHUB_WORKSPACE/patches/features54.py" "$GITHUB_WORKSPACE/patches"
          python3 "$GITHUB_WORKSPACE/patches/stealth54.py"
      - name: susfs
        run: |
          cd kernel
          git clone --depth 1 -b kernel-5.4 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs
          cp /tmp/susfs/kernel_patches/fs/susfs.c fs/susfs.c
          cp /tmp/susfs/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          cp /tmp/susfs/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h
          patch -p1 --forward --batch --fuzz=3 < /tmp/susfs/kernel_patches/50_add_susfs_in_kernel-5.4.patch || true
          python3 "$GITHUB_WORKSPACE/patches/susfs_fixup.py"
          echo "--- 校验 ---"
          grep -c susfs fs/Makefile
          test -f fs/susfs.c && test -f include/linux/susfs.h && echo "[+] susfs 文件就位"
      - name: configure
        run: |
          cd kernel
          make O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 TARGET_PRODUCT=star vendor/lahaina-qgki_defconfig vendor/debugfs.config vendor/xiaomi_QGKI.config
          for c in KSU KPROBES KALLSYMS_ALL EXT4_FS HEADERS_INSTALL KSU_SUSFS THREAD_INFO_IN_TASK KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG NOMOUNT; do ./scripts/config --file out/.config --enable $c; done
                    ./scripts/config --file out/.config --disable KSU_HOOK_SUSFS_INLINE
          ./scripts/config --file out/.config --disable KSU_SUSFS_ENABLE_LOG
          ./scripts/config --file out/.config --disable KSU_DEBUG
          ./scripts/config --file out/.config --disable IKCONFIG_PROC
          ./scripts/config --file out/.config --disable WERROR
          make O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 TARGET_PRODUCT=star olddefconfig
          grep -E "^CONFIG_(KSU|KPROBES|KALLSYMS_ALL|EXT4_FS|HEADERS_INSTALL)=" out/.config
      - name: ksu quick check
        run: |
          cd kernel
          make O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 TARGET_PRODUCT=star prepare >/dev/null 2>&1 || true
          make O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 TARGET_PRODUCT=star security/selinux/ >/tmp/sel.log 2>&1 || true
          set +e
          make O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 TARGET_PRODUCT=star drivers/kernelsu/ > /tmp/ksu.log 2>&1
          rc=$?
          echo "ksu quick rc=$rc"
          if [ $rc -ne 0 ]; then grep -E 'error:' /tmp/ksu.log | head -20; tail -15 /tmp/ksu.log; fi
          exit $rc
      - name: nomount quick check
        run: |
          cd kernel
          set +e
          make O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- TARGET_PRODUCT=star fs/nomount/ > /tmp/nm.log 2>&1
          rc=$?
          echo "nomount quick rc=$rc"
          if [ $rc -ne 0 ]; then grep -E 'error:' /tmp/nm.log | head -20; tail -20 /tmp/nm.log; fi
          exit $rc
      - name: build
        run: |
          cd kernel
          set +e
          make O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 TARGET_PRODUCT=star -j$(nproc) KCFLAGS="-Wno-error" KSU_REQUIRE_PREINIT=1 KSU_EXPECTED_SIZE2=0x02cc KSU_EXPECTED_HASH2=2d89b50aaf1db013c2b6738f973f48b62ea21a3a8d7216bfec3521065d448458 KSU_SECOND_SIGNATURE_RELEASE=1 Image > /tmp/build.log 2>&1
          rc=$?
          echo "make exit=$rc"
          first=$(grep -nE 'Error [0-9]+' /tmp/build.log | head -1 | cut -d: -f1)
          if [ -n "$first" ]; then sed -n "$((first-25)),$((first+3))p" /tmp/build.log; else tail -40 /tmp/build.log; fi
          ls -l out/arch/arm64/boot/Image 2>/dev/null
          exit $rc
      - name: package
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          sed -i 's|^kernel.string=.*|kernel.string=FinaSU sm8350 star (CI)|' anykernel.sh
          sed -i 's|^do.devicecheck=.*|do.devicecheck=1|' anykernel.sh
          sed -i 's|^device.name1=.*|device.name1=star|' anykernel.sh
          sed -i 's|^device.name2=.*|device.name2=mars|' anykernel.sh
          sed -i 's|^device.name3=.*|device.name3=|' anykernel.sh
          sed -i 's|^device.name4=.*|device.name4=|' anykernel.sh
          sed -i 's|^block=.*|block=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          zip -r9 "$GITHUB_WORKSPACE/finasu-sm8350-star.zip" . -x ".git/*" "README.md" ".github/*"
          cd .. && ls -lh finasu-sm8350-star.zip
      - uses: actions/upload-artifact@v4
        with:
          name: finasu-sm8350-star
          path: finasu-sm8350-star.zip
